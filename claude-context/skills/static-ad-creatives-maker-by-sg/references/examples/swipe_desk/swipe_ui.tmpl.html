<title>Swipe Desk</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Instrument+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* Layout: a dark light-table. The ad is the brightest object on the page; decisions are four stamps. Left stage with the ad, right panel with facts, reasons and stamps; on a phone the stamps sit in a thumb bar. */
:root {
  --stage: #15161a; --panel: #1d1f24; --panel2: #25282e; --line: #31353d; --ink: #ece9e2; --mute: #9298a2;
  --approve: #43b581; --reject: #e5594f; --maybe: #e3a72f; --other: #8794b3; --on: #0e0f12;
  --f-display: "Bricolage Grotesque", "Arial Narrow", system-ui, sans-serif;
  --f-ui: "Instrument Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  color-scheme: dark;
}
@media (prefers-color-scheme: light) { :root:not([data-theme="dark"]) {
  --stage: #eeede9; --panel: #ffffff; --panel2: #f5f4f0; --line: #dad8d1; --ink: #1b1c1f; --mute: #646973;
  --approve: #1c8a5b; --reject: #c53a31; --maybe: #a8730a; --other: #556489; --on: #ffffff; color-scheme: light; } }
:root[data-theme="light"] {
  --stage: #eeede9; --panel: #ffffff; --panel2: #f5f4f0; --line: #dad8d1; --ink: #1b1c1f; --mute: #646973;
  --approve: #1c8a5b; --reject: #c53a31; --maybe: #a8730a; --other: #556489; --on: #ffffff; color-scheme: light; }
* { box-sizing: border-box; }
[hidden] { display: none !important; }   /* the sections set display:grid, which would otherwise win over the hidden attribute */
html, body { margin: 0; }
body { background: var(--stage); color: var(--ink); font: 15px/1.45 var(--f-ui); padding-inline: 16px; padding-block: 0 24px; }
button { font: inherit; color: inherit; }
.wrap { max-width: 1180px; margin: 0 auto; }
header.bar { display: flex; align-items: center; gap: 16px 24px; flex-wrap: wrap; padding-block: 14px; position: sticky; top: env(safe-area-inset-top, 0px); background: var(--stage); z-index: 5; border-bottom: 1px solid var(--line); }
.mark { font: 800 22px/1 var(--f-display); letter-spacing: -.01em; }
.mark small { font: 500 11px/1 var(--f-mono); color: var(--mute); letter-spacing: .08em; text-transform: uppercase; margin-left: 10px; }
.prog { flex: 1 1 220px; min-width: 0; display: flex; flex-direction: column; gap: 6px; }
.prog .nums { font: 500 12px/1 var(--f-mono); color: var(--mute); display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.prog .nums b { color: var(--ink); font-weight: 500; }
.track { display: flex; gap: 2px; height: 6px; }
.track i { flex: 1; background: var(--line); border-radius: 1px; }
.track i.approve { background: var(--approve); } .track i.reject { background: var(--reject); } .track i.maybe { background: var(--maybe); } .track i.other { background: var(--other); }
nav.tabs { display: flex; gap: 4px; }
nav.tabs button { background: none; border: 1px solid transparent; padding: 7px 12px; border-radius: 8px; color: var(--mute); cursor: pointer; font-weight: 500; }
nav.tabs button[aria-selected="true"] { color: var(--ink); border-color: var(--line); background: var(--panel); }
nav.tabs button:hover { color: var(--ink); }
:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
.notice { font: 12px/1.3 var(--f-mono); color: var(--maybe); }
#review { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(300px, .75fr); gap: 24px; padding-block: 20px; align-items: start; }
.stage { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 14px; display: flex; align-items: center; justify-content: center; min-height: 320px; }
.stage img { display: block; max-width: 100%; max-height: min(78vh, 900px); width: auto; height: auto; border-radius: 4px; }
.panel { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
.brandline { font: 500 12px/1.3 var(--f-mono); color: var(--mute); text-transform: uppercase; letter-spacing: .06em; display: flex; flex-wrap: wrap; gap: 4px 12px; }
.brandline b { color: var(--ink); font-weight: 500; }
.headline { font: 800 clamp(22px, 3.2vw, 30px)/1.12 var(--f-display); letter-spacing: -.01em; text-wrap: balance; margin: 0; overflow-wrap: anywhere; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { font: 500 11px/1 var(--f-mono); padding: 6px 8px; border: 1px solid var(--line); border-radius: 6px; color: var(--mute); text-transform: uppercase; letter-spacing: .04em; }
.feed { background: var(--panel2); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; font-size: 13px; color: var(--mute); overflow-wrap: anywhere; max-height: 7.6em; overflow: auto; }
.feed b { color: var(--ink); font-weight: 600; display: block; margin-bottom: 4px; }
.why { font-size: 13px; color: var(--mute); }
.why a { color: var(--ink); text-underline-offset: 3px; }
.label { font: 500 11px/1 var(--f-mono); color: var(--mute); text-transform: uppercase; letter-spacing: .08em; margin-bottom: 8px; display: block; }
.reasons { display: flex; flex-wrap: wrap; gap: 6px; }
.reasons button { background: none; border: 1px solid var(--line); border-radius: 999px; padding: 7px 12px; cursor: pointer; font-size: 13px; color: var(--mute); }
.reasons button[aria-pressed="true"] { color: var(--ink); border-color: var(--ink); background: var(--panel2); }
textarea { width: 100%; min-height: 76px; resize: vertical; background: var(--panel2); color: var(--ink); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; font: inherit; }
textarea::placeholder { color: var(--mute); }
.stamps { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.stamp { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 14px 16px; border-radius: 10px; border: 2px solid var(--c); background: none; color: var(--c); font: 800 17px/1 var(--f-display); letter-spacing: .01em; cursor: pointer; text-align: left; transition: background .12s, color .12s, transform .06s; }
.stamp kbd { font: 500 11px/1 var(--f-mono); border: 1px solid currentColor; border-radius: 4px; padding: 3px 5px; opacity: .8; }
.stamp:hover { background: var(--c); color: var(--on); }
.stamp:active { transform: scale(.98); }
.stamp.approve { --c: var(--approve); } .stamp.reject { --c: var(--reject); } .stamp.maybe { --c: var(--maybe); } .stamp.other { --c: var(--other); }
.panel .stamps { position: sticky; bottom: 10px; background: var(--stage); padding: 10px 0 6px; z-index: 4; }
.undo { background: none; border: 0; color: var(--mute); text-decoration: underline; text-underline-offset: 3px; cursor: pointer; padding: 4px 0; font-size: 13px; align-self: flex-start; }
.undo:disabled { opacity: .4; cursor: default; text-decoration: none; }
.toast { position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom, 0px) + 92px); transform: translateX(-50%); background: var(--ink); color: var(--stage); padding: 9px 14px; border-radius: 8px; font: 500 13px/1 var(--f-mono); opacity: 0; pointer-events: none; transition: opacity .15s; z-index: 20; max-width: 90vw; }
.toast.show { opacity: 1; }
.empty { grid-column: 1 / -1; padding: 48px 8px; max-width: 640px; }
.empty h2 { font: 800 28px/1.1 var(--f-display); margin: 0 0 10px; }
.empty p { color: var(--mute); margin: 0 0 8px; }
.more { background: none; border: 1px solid var(--line); border-radius: 999px; padding: 8px 16px; cursor: pointer; color: var(--mute); margin: 0 0 24px; }
.pill-row { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 14px; }
.pill-row button { background: none; border: 1px solid var(--line); border-radius: 999px; padding: 6px 12px; cursor: pointer; color: var(--mute); font-size: 13px; }
.pill-row button[aria-pressed="true"] { color: var(--ink); border-color: var(--ink); }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; padding-block: 8px 24px; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; cursor: pointer; position: relative; padding: 0; text-align: left; display: flex; flex-direction: column; min-width: 0; }
.card .ph { aspect-ratio: 1 / 1; background: var(--panel2); display: flex; align-items: center; justify-content: center; color: var(--mute); font: 800 28px var(--f-display); overflow: hidden; }
.card img { width: 100%; height: 100%; object-fit: cover; display: block; }
.card .meta { padding: 8px 10px 10px; font-size: 12px; color: var(--mute); min-width: 0; }
.card .meta b { color: var(--ink); font-weight: 500; display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.badge { position: absolute; top: 8px; left: 8px; font: 800 11px/1 var(--f-display); letter-spacing: .04em; text-transform: uppercase; padding: 5px 7px; border-radius: 5px; background: var(--c); color: var(--on); }
.badge.approve { --c: var(--approve); } .badge.reject { --c: var(--reject); } .badge.maybe { --c: var(--maybe); } .badge.other { --c: var(--other); }
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 16px; padding-block: 16px; }
.box { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 16px; min-width: 0; }
.box h3 { font: 800 16px/1.1 var(--f-display); margin: 0 0 12px; }
.row { display: grid; grid-template-columns: minmax(80px, 38%) 1fr auto; align-items: center; gap: 10px; padding-block: 4px; font-size: 13px; }
.row span:first-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.bar2 { height: 8px; background: var(--line); border-radius: 2px; overflow: hidden; display: flex; }
.bar2 i { display: block; height: 100%; }
.bar2 .approve { background: var(--approve); } .bar2 .reject { background: var(--reject); } .bar2 .maybe { background: var(--maybe); } .bar2 .other { background: var(--other); }
.row em { font: 500 12px var(--f-mono); color: var(--mute); font-style: normal; }
.big { font: 800 38px/1 var(--f-display); }
.sub { color: var(--mute); font-size: 13px; }
dialog { background: var(--panel); color: var(--ink); border: 1px solid var(--line); border-radius: 14px; padding: 0; width: min(920px, calc(100vw - 32px)); }
dialog::backdrop { background: rgba(0, 0, 0, .6); }
dialog .in { display: grid; grid-template-columns: minmax(0, 1fr) minmax(260px, 340px); gap: 18px; padding: 18px; }
dialog img { max-width: 100%; max-height: 70vh; display: block; margin: auto; border-radius: 4px; }
dialog .x { justify-self: end; background: none; border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; cursor: pointer; color: var(--mute); }
@media (max-width: 820px) {
  #review { grid-template-columns: minmax(0, 1fr); gap: 14px; padding-bottom: 150px; }
  .stage { padding: 8px; min-height: 0; }
  .stage img { max-height: 56vh; }
  .stamps { position: fixed; left: 0; right: 0; bottom: 0; z-index: 10; background: var(--stage); border-top: 1px solid var(--line); padding: 10px 16px calc(env(safe-area-inset-bottom, 0px) + 10px); grid-template-columns: repeat(4, 1fr); gap: 8px; }
  .stamp { flex-direction: column; justify-content: center; gap: 6px; padding: 12px 4px; font-size: 14px; text-align: center; }
  .stamp kbd { display: none; }
  dialog .in { grid-template-columns: minmax(0, 1fr); }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<div class="wrap">
  <header class="bar">
    <div class="mark">Swipe Desk<small id="dateTag"></small></div>
    <div class="prog" aria-live="polite">
      <div class="nums"><span id="todayNum"></span><span id="allNum"></span></div>
      <div class="track" id="track" aria-hidden="true"></div>
    </div>
    <nav class="tabs" role="tablist" aria-label="Views">
      <button role="tab" id="tab-review" aria-selected="true" data-tab="review">Review</button>
      <button role="tab" id="tab-history" aria-selected="false" data-tab="history">History</button>
      <button role="tab" id="tab-stats" aria-selected="false" data-tab="stats">Stats</button>
    </nav>
    <div class="notice" id="notice" hidden>Saving on this device only</div>
  </header>

  <section id="review" aria-label="Review"></section>
  <section id="history" hidden aria-label="History"></section>
  <section id="stats" hidden aria-label="Stats"></section>
</div>

<dialog id="dlg"><div class="in" id="dlgIn"></div></dialog>
<div class="toast" id="toast" role="status"></div>

<script>
(function () {
  "use strict";
  var BATCH = /*BATCH_JSON*/[];
  var THUMBS = /*THUMBS_JSON*/{};
  var BATCH_DATE = "/*BATCH_DATE*/";
  var REASONS = ["Copy", "Layout", "Colour", "Idea", "Photo", "Type", "Offer", "Format"];
  var LABEL = { approve: "Approved", reject: "Disapproved", maybe: "Maybe", other: "Note" };
  var FORMAT = { product_hero: "Product shot", lifestyle_scene: "Scene", ugc_or_creator_photo: "Creator photo", fake_screen: "Fake screen", typographic_offer: "Text offer",
    explainer_or_infographic: "Explainer", comparison_or_before_after: "Comparison", testimonial_or_review_card: "Review card", multi_product_collage: "Range", meme_or_humour: "Humour", other: "Other" };
  var COUNTRY = { IN: "India", US: "US", GB: "UK" };
  var STORE_KEY = "swipe_desk_decisions_v1";

  var db = null, decisions = {}, current = null, picked = {}, last = null, tab = "review", filter = "all", noteOpen = false, localOnly = true, histLimit = 120;
  var $ = function (id) { return document.getElementById(id); };
  var esc = function (s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); };

  function loadLocal() { try { return JSON.parse(localStorage.getItem(STORE_KEY) || "{}"); } catch (e) { return {}; } }
  function saveLocal() { try { localStorage.setItem(STORE_KEY, JSON.stringify(decisions)); } catch (e) {} }
  function toast(t) { var el = $("toast"); el.textContent = t; el.classList.add("show"); clearTimeout(toast.t); toast.t = setTimeout(function () { el.classList.remove("show"); }, 1400); }

  function byId(id) { for (var i = 0; i < BATCH.length; i++) if (BATCH[i].id === id) return BATCH[i]; return null; }
  function queue() { return BATCH.filter(function (b) { return !decisions[b.id]; }); }
  function all() { return Object.keys(decisions).map(function (k) { return decisions[k]; }).sort(function (a, b) { return (b.at || "").localeCompare(a.at || ""); }); }

  /* ---------- storage ---------- */
  async function write(doc) {
    decisions[doc.id] = doc; saveLocal();
    if (db) { try { await db.doc("decisions/" + doc.id).set(doc); localOnly = false; } catch (e) { toast("Not saved to the cloud, kept on this device"); } }
  }
  async function remove(id) {
    delete decisions[id]; saveLocal();
    if (db) { try { await db.doc("decisions/" + id).delete(); } catch (e) {} }
  }

  /* ---------- decide ---------- */
  function decide(kind, item, opts) {
    item = item || current; if (!item) return;
    var note = ($("note") && $("note").value || "").trim();
    if (kind === "other" && !note && !(opts && opts.note)) { noteOpen = true; renderReview(); var n = $("note"); if (n) n.focus(); toast("Type a note, then press Save note"); return; }
    var doc = { id: item.id, decision: kind, tags: Object.keys(picked).filter(function (k) { return picked[k]; }), note: (opts && opts.note != null ? opts.note : note), at: new Date().toISOString(),
      brand: item.brand, country: item.country, days: item.days, format: item.format, hook: item.hook, offer: item.offer, bucket: item.bucket, headline: item.headline, ad: item.ad, link: item.link, batch: item.batch || BATCH_DATE };
    var prev = decisions[item.id];
    last = { id: item.id, prev: prev || null };
    picked = {}; noteOpen = false;
    toast(LABEL[kind]);
    write(doc).then(function () { render(); });
    render();
  }
  function undo() {
    if (!last) return;
    var l = last; last = null;
    (l.prev ? write(l.prev) : remove(l.id)).then(function () { toast("Undone"); render(); });
    render();
  }

  /* ---------- review ---------- */
  function renderReview() {
    var q = queue(), box = $("review");
    current = q[0] || null;
    if (!current) {
      box.innerHTML = '<div class="empty"><h2>' + (BATCH.length ? "You are through everything in the queue." : "Nothing loaded yet.") + '</h2>' +
        (BATCH.length ? "<p>It refills on its own every morning, so open it again later. Approved ads go into the inspiration library, sorted by format.</p>" : "<p>The first queue is published with the page.</p>") + "</div>";
      return;
    }
    for (var k = 1; k <= 2; k++) { if (q[k] && q[k].img) { var pre = new Image(); pre.src = q[k].img; } }
    var c = current, parts = [];
    parts.push('<div class="stage"><img id="adimg" alt="Ad from ' + esc(c.brand) + ', running ' + esc(c.days) + ' days" src="' + c.img + '"></div>');
    parts.push('<div class="panel">');
    parts.push('<div class="brandline"><b>' + esc(c.brand) + "</b><span>" + esc(COUNTRY[c.country] || c.country) + "</span><span>running " + esc(c.days) + " days</span></div>");
    if (c.headline) parts.push('<p class="headline">' + esc(c.headline) + "</p>");
    var chips = [FORMAT[c.format] || c.format, c.hook && c.hook !== "none" ? c.hook.replace(/_/g, " ") : "", c.offer && c.offer !== "none" ? c.offer.replace(/_/g, " ") : ""].filter(Boolean);
    parts.push('<div class="chips">' + chips.map(function (t) { return '<span class="chip">' + esc(t) + "</span>"; }).join("") + "</div>");
    if (c.title || c.body) parts.push('<div class="feed"><b>In the feed</b>' + esc([c.title, c.body].filter(Boolean).join(" \u00b7 ").slice(0, 380)) + "</div>");
    parts.push('<div class="why">' + esc(c.why || "") + (c.link ? ' <a href="' + esc(c.link) + '" target="_blank" rel="noopener">Open in Ad Library</a>' : "") + "</div>");
    parts.push('<div><span class="label">What drives it? (optional)</span><div class="reasons" id="reasons">' + REASONS.map(function (r) { return '<button type="button" data-r="' + r + '" aria-pressed="' + (picked[r] ? "true" : "false") + '">' + r + "</button>"; }).join("") + "</div></div>");
    parts.push('<div><span class="label">Note</span><textarea id="note" placeholder="' + (noteOpen ? "What do you want to say about this one?" : "Add a note (optional). For Others, write it here.") + '"></textarea></div>');
    parts.push('<div class="stamps" id="stamps">' +
      '<button class="stamp approve" data-k="approve">Approve <kbd>A</kbd></button>' +
      '<button class="stamp reject" data-k="reject">Disapprove <kbd>D</kbd></button>' +
      '<button class="stamp maybe" data-k="maybe">Maybe <kbd>M</kbd></button>' +
      '<button class="stamp other" data-k="other">Others <kbd>O</kbd></button></div>');
    parts.push('<button class="undo" id="undo"' + (last ? "" : " disabled") + '>Undo last (Z)</button>');
    parts.push("</div>");
    box.innerHTML = parts.join("");
    $("reasons").addEventListener("click", function (e) { var b = e.target.closest("button[data-r]"); if (!b) return; picked[b.dataset.r] = !picked[b.dataset.r]; b.setAttribute("aria-pressed", picked[b.dataset.r] ? "true" : "false"); });
    $("stamps").addEventListener("click", function (e) { var b = e.target.closest("button[data-k]"); if (b) decide(b.dataset.k); });
    $("undo").addEventListener("click", undo);
  }

  /* ---------- header ---------- */
  function sameDay(iso) { if (!iso) return false; var a = new Date(iso), b = new Date(); return a.getFullYear() === b.getFullYear() && a.getMonth() === b.getMonth() && a.getDate() === b.getDate(); }
  function renderBar() {
    $("dateTag").textContent = BATCH_DATE ? "refilled " + BATCH_DATE : "";
    var A = all(), tape = A.slice(0, 40).reverse(), seg = "";
    for (var i = tape.length; i < 40; i++) seg += "<i></i>";
    $("track").innerHTML = seg + tape.map(function (d) { return '<i class="' + d.decision + '"></i>'; }).join("");
    var ap = A.filter(function (d) { return d.decision === "approve"; }).length, today = A.filter(function (d) { return sameDay(d.at); }).length;
    $("todayNum").innerHTML = "<b>" + queue().length + "</b> waiting";
    $("allNum").innerHTML = "<b>" + today + "</b> today \u00b7 <b>" + A.length + "</b> in all" + (A.length ? " \u00b7 " + Math.round(100 * ap / A.length) + "% approved" : "");
    $("notice").hidden = !!db;
  }

  /* ---------- history ---------- */
  function thumbOf(id) { var b = byId(id); return (b && b.img) || THUMBS[id] || ""; }
  function renderHistory() {
    var A = all().filter(function (d) { return filter === "all" || d.decision === filter; });
    var pills = ["all", "approve", "reject", "maybe", "other"].map(function (k) { return '<button type="button" data-f="' + k + '" aria-pressed="' + (filter === k ? "true" : "false") + '">' + (k === "all" ? "All" : LABEL[k]) + "</button>"; }).join("");
    var shown = A.slice(0, histLimit);
    var cards = shown.map(function (d) {
      var t = thumbOf(d.id);
      return '<button class="card" data-id="' + esc(d.id) + '"><span class="badge ' + d.decision + '">' + LABEL[d.decision] + '</span><div class="ph">' + (t ? '<img alt="" src="' + t + '">' : esc((d.brand || "?").slice(0, 1))) + '</div><div class="meta"><b>' + esc(d.brand) + "</b>" + esc(FORMAT[d.format] || d.format || "") + (d.note ? " \u00b7 note" : "") + "</div></button>";
    }).join("");
    $("history").innerHTML = '<div class="pill-row" id="pills">' + pills + "</div>" + (A.length ? '<div class="grid" id="grid">' + cards + "</div>" + (A.length > shown.length ? '<button type="button" class="more" id="more">Show more (' + (A.length - shown.length) + " left)</button>" : "") : '<p class="sub">Nothing here yet.</p>');
    $("pills").addEventListener("click", function (e) { var b = e.target.closest("button[data-f]"); if (b) { filter = b.dataset.f; renderHistory(); } });
    var g = $("grid"); if (g) g.addEventListener("click", function (e) { var c = e.target.closest(".card"); if (c) openDialog(c.dataset.id); });
    var mo = $("more"); if (mo) mo.addEventListener("click", function () { histLimit += 120; renderHistory(); });
  }
  function openDialog(id) {
    var d = decisions[id]; if (!d) return;
    var t = thumbOf(id);
    $("dlgIn").innerHTML = '<div>' + (t ? '<img alt="" src="' + t + '">' : "") + '</div><div class="panel"><button class="x" id="dx" style="align-self:flex-end">Close</button>' +
      '<div class="brandline"><b>' + esc(d.brand) + "</b><span>" + esc(COUNTRY[d.country] || d.country || "") + "</span><span>" + esc(d.days) + " days</span></div>" +
      (d.headline ? '<p class="headline" style="font-size:22px">' + esc(d.headline) + "</p>" : "") +
      '<div class="chips"><span class="chip">now: ' + LABEL[d.decision] + "</span>" + (d.tags || []).map(function (x) { return '<span class="chip">' + esc(x) + "</span>"; }).join("") + "</div>" +
      '<div><span class="label">Note</span><textarea id="dnote">' + esc(d.note || "") + "</textarea></div>" +
      '<div class="stamps" id="dst"><button class="stamp approve" data-k="approve">Approve</button><button class="stamp reject" data-k="reject">Disapprove</button><button class="stamp maybe" data-k="maybe">Maybe</button><button class="stamp other" data-k="other">Others</button></div></div>';
    $("dx").addEventListener("click", function () { $("dlg").close(); });
    $("dst").addEventListener("click", function (e) {
      var b = e.target.closest("button[data-k]"); if (!b) return;
      var nd = Object.assign({}, d, { decision: b.dataset.k, note: $("dnote").value.trim(), at: new Date().toISOString() });
      write(nd).then(function () { $("dlg").close(); toast(LABEL[nd.decision]); render(); });
    });
    $("dlg").showModal();
  }

  /* ---------- stats ---------- */
  function tally(list, keyFn) {
    var m = {};
    list.forEach(function (d) { var k = keyFn(d); if (!k) return; (m[k] = m[k] || { approve: 0, reject: 0, maybe: 0, other: 0, n: 0 })[d.decision]++; m[k].n++; });
    return Object.keys(m).map(function (k) { return { k: k, v: m[k] }; }).sort(function (a, b) { return b.v.n - a.v.n; });
  }
  function rows(t, max) {
    return t.slice(0, max || 8).map(function (r) {
      var n = r.v.n, w = function (x) { return (100 * x / n).toFixed(1) + "%"; };
      return '<div class="row"><span title="' + esc(r.k) + '">' + esc(r.k) + '</span><span class="bar2"><i class="approve" style="width:' + w(r.v.approve) + '"></i><i class="maybe" style="width:' + w(r.v.maybe) + '"></i><i class="other" style="width:' + w(r.v.other) + '"></i><i class="reject" style="width:' + w(r.v.reject) + '"></i></span><em>' + r.v.approve + "/" + n + "</em></div>";
    }).join("") || '<p class="sub">No data yet.</p>';
  }
  function renderStats() {
    var A = all(), ap = A.filter(function (d) { return d.decision === "approve"; }).length, rj = A.filter(function (d) { return d.decision === "reject"; }).length;
    var tg = {}; A.forEach(function (d) { (d.tags || []).forEach(function (t) { var k = t + " \u00b7 " + d.decision; tg[k] = (tg[k] || 0) + 1; }); });
    var tgl = Object.keys(tg).sort(function (a, b) { return tg[b] - tg[a]; }).slice(0, 10).map(function (k) { return '<div class="row"><span>' + esc(k) + "</span><span></span><em>" + tg[k] + "</em></div>"; }).join("") || '<p class="sub">No reasons ticked yet.</p>';
    $("stats").innerHTML = '<div class="stats">' +
      '<div class="box"><h3>So far</h3><div class="big">' + A.length + '</div><p class="sub">' + ap + " approved, " + rj + " disapproved, " + (A.length - ap - rj) + " maybe or note. Bars read approved (green), maybe, note, disapproved (red); the number is approved of total.</p></div>" +
      '<div class="box"><h3>By format</h3>' + rows(tally(A, function (d) { return FORMAT[d.format] || d.format; })) + "</div>" +
      '<div class="box"><h3>By country</h3>' + rows(tally(A, function (d) { return COUNTRY[d.country] || d.country; })) + "</div>" +
      '<div class="box"><h3>By hook</h3>' + rows(tally(A, function (d) { return d.hook && d.hook !== "none" ? d.hook.replace(/_/g, " ") : "no hook"; })) + "</div>" +
      '<div class="box"><h3>By brand</h3>' + rows(tally(A, function (d) { return d.brand; }), 10) + "</div>" +
      '<div class="box"><h3>What drives it</h3>' + tgl + "</div></div>";
  }

  /* ---------- shell ---------- */
  function render() {
    renderBar();
    if (tab === "review") renderReview(); else if (tab === "history") renderHistory(); else renderStats();
  }
  function setTab(t) {
    tab = t;
    ["review", "history", "stats"].forEach(function (k) { $(k).hidden = k !== t; $("tab-" + k).setAttribute("aria-selected", k === t ? "true" : "false"); });
    render();
  }
  document.querySelector("nav.tabs").addEventListener("click", function (e) { var b = e.target.closest("button[data-tab]"); if (b) setTab(b.dataset.tab); });
  document.addEventListener("keydown", function (e) {
    if (tab !== "review" || e.metaKey || e.ctrlKey || e.altKey) return;
    var tg = e.target && e.target.tagName;
    if (tg === "TEXTAREA" || tg === "INPUT") { if (tg === "TEXTAREA" && e.key === "Enter" && (e.ctrlKey || e.shiftKey)) { e.preventDefault(); decide("other"); } return; }
    var k = e.key.toLowerCase();
    if (k === "a") decide("approve"); else if (k === "d") decide("reject"); else if (k === "m") decide("maybe"); else if (k === "o") decide("other"); else if (k === "z") undo();
  });

  decisions = loadLocal();
  render();
  if (window.claude && window.claude.use) {
    window.claude.use("db").then(function (d) {
      if (!d) { render(); return; }
      db = d; localOnly = false;
      db.collection("decisions").onSnapshot(function (snap) {
        var m = {}; snap.docs.forEach(function (x) { m[x.id] = x.data(); });
        var localOnlyDocs = Object.keys(decisions).filter(function (k) { return !m[k]; });
        decisions = m; saveLocal();
        localOnlyDocs.forEach(function (k) { /* decisions made offline are not re-sent automatically */ });
        render();
      }, function () { db = null; localOnly = true; render(); });
    }).catch(function () { render(); });
  }
})();
</script>
